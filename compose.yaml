services:
  expert-system:
    build:
      context: .
      target: runtime
    image: llm-expert-system:local
    ports:
      - "127.0.0.1:${LLM_EXPERT_HOST_PORT:-8000}:8000"
    environment:
      LLM_EXPERT_WORKSPACE: /data
      LLM_EXPERT_PROVIDER: ${LLM_EXPERT_PROVIDER:-fake}
      LLM_EXPERT_MODEL: ${LLM_EXPERT_MODEL:-fake/deterministic}
      LLM_EXPERT_API_HOST: 0.0.0.0
      LLM_EXPERT_API_TOKEN: ${LLM_EXPERT_API_TOKEN:?Set LLM_EXPERT_API_TOKEN}
    volumes:
      - expert-data:/data
      - ./examples:/examples:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [frontend]

networks:
  frontend:

volumes:
  expert-data:
