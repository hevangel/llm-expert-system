name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - name: Install uv
        run: python -m pip install uv==0.9.28
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra engines
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=xml
      - run: uv run llm-expert export-schema --destination generated-schemas
      - name: Verify schemas are current
        shell: bash
        run: diff -ru schemas generated-schemas

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target runtime -t llm-expert-system:ci .
      - run: docker run --rm llm-expert-system:ci llm-expert diagnostics --json
